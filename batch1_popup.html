function rel(e){let h='';if(e.syn&&e.syn.length)h+='<div class="rel"><span class="lbl">동의어</span>'+e.syn.map(x=>'<span class="chip syn">'+x+'</span>').join('')+'</div>';if(e.ant&&e.ant.length)h+='<div class="rel"><span class="lbl">반대어</span>'+e.ant.map(x=>'<span class="chip ant">'+x+'</span>').join('')+'</div>';return h}
function ex(e){if(!e.ex)return '';return '<div class="ex"><div class="exzh">'+e.ex.zh+'</div><div class="expy">'+e.ex.py+'</div><div class="exen">'+e.ex.en+'</div></div>'}
const dc=document.getElementById('demos');
DATA.demos.forEach(function(dm){const q=document.createElement('div');q.className='q';const l=document.createElement('div');l.className='zh';
dm.toks.forEach(function(t){if(!t.clk){const s=document.createElement('span');s.className='plain';s.textContent=t.t;l.appendChild(s);return}
const s=document.createElement('span');s.className='w'+(t.has?'':' no');s.textContent=t.t;s.onclick=function(){openSheet(t.t,t.has)};l.appendChild(s)});q.appendChild(l);dc.appendChild(q)});
const grid=document.getElementById('grid'),count=document.getElementById('count'),search=document.getElementById('search');
const keys=Object.keys(D);
function render(q){q=(q||'').trim().toLowerCase();let ks=keys;if(q)ks=keys.filter(w=>w.includes(q)||(D[w].py||'').toLowerCase().replace(/[̄́̌̀]/g,'').includes(q)||(D[w].en||'').toLowerCase().includes(q));
count.textContent=ks.length+'개'+(q?' (검색: '+q+')':' 전체');ks=ks.slice(0,q?400:120);
grid.innerHTML=ks.map(function(w){const e=D[w];return '<div class="card"><div class="hw">'+w+pos(e.pos)+'</div><div class="py">'+e.py+'</div><div class="en">'+e.en+'</div>'+rel(e)+ex(e)+'</div>'}).join('');
if(!q)count.textContent+=' 중 앞 120개 표시 — 검색으로 좁히세요'}
search.addEventListener('input',e=>render(e.target.value));render('');
const scrim=document.getElementById('scrim'),sheet=document.getElementById('sheet'),sin=document.getElementById('sheetin');
function openSheet(w,has){if(has&&D[w]){const e=D[w];sin.innerHTML='<div class="grab"></div><button class="saudio">🔊</button><div class="sh-hw">'+w+pos(e.pos)+'</div><div class="sh-py">'+e.py+'</div><div class="sh-en">'+e.en+'</div>'+rel(e)+ex(e)}
else sin.innerHTML='<div class="grab"></div><div class="sh-hw">'+w+'</div><div class="sh-note">불용어(的/了 등) 또는 아직 미저작 단어입니다. 클릭 대상으로는 등록돼 있습니다.</div>';
scrim.classList.add('on');sheet.classList.add('on')}
function closeSheet(){scrim.classList.remove('on');sheet.classList.remove('on')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
</script></body></html>
